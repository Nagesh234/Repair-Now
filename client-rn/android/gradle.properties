# gradle.properties — Repair Now Client App
# Project-wide Gradle settings for the Android build.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Enables Gradle build caching (speeds up subsequent builds)
org.gradle.caching=true
# Enables parallel project execution
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.enableJetifier=true

# React Native New Architecture (set to false if you see undefined symbol errors)
newArchEnabled=false
# Hermes JS engine (significantly improves performance and startup time)
hermesEnabled=true
